[project]
name = "rmf2-map-server"
version = "0.1.0"
description = "RMF2 Map Server — VDA5050 LIF layout and robot configuration REST API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115.0",
]

[project.scripts]
serve = "app.main:app"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
